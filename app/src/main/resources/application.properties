spring.application.name=hospital-app
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/hospital_v1?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
spring.datasource.username=${DB_USERNAME:hospital_app}
spring.datasource.password=${MYSQL_APP_PASSWORD}
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
hospital.username=${HOSPITAL_USERNAME:staff}
hospital.password=${HOSPITAL_PASSWORD}
hospital.time-zone=${HOSPITAL_TIME_ZONE:UTC}
