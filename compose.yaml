services:
  database:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set a password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - hospital_mysql_data:/var/lib/mysql
      - ./database/v1/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  database-test:
    profiles: ["test"]
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: hospital_test_only
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  hospital_mysql_data:
