name: Database integration

on:
  push:
    paths: ["database/**", "compose.yaml", ".github/workflows/database.yml"]
  pull_request:
    paths: ["database/**", "compose.yaml", ".github/workflows/database.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_database_tests_only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r database/v1/tests/requirements.txt
      - name: Validate schema, workflows, privileges, and concurrent bookings
        env:
          MYSQL_ROOT_PASSWORD: ci_database_tests_only
        run: python database/v1/tests/test_database.py
