<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Patient record')}"></head>
<body><aside th:replace="~{fragments :: sidebar('patients')}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar}"></header><main>
  <a class="back" th:href="@{/patients}">← Patient directory</a><div class="page-heading"><div><p class="eyebrow" th:text="${'PATIENT #' + patient.id}"></p><h1 th:text="${patient.name}"></h1></div><div class="actions"><a class="button secondary" th:href="@{/patients/{id}/edit(id=${patient.id})}">Edit details</a><a class="button" th:href="@{/appointments/new(patientId=${patient.id})}">+ Book appointment</a></div></div>
  <div th:replace="~{fragments :: notices}"></div><section class="panel detail-panel"><dl class="detail-grid"><div><dt>Date of birth</dt><dd th:text="${#temporals.format(patient.dateOfBirth, 'yyyy-MM-dd')}"></dd></div><div><dt>Phone</dt><dd th:text="${patient.phone ?: 'Not provided'}"></dd></div><div><dt>Primary physician</dt><dd th:text="${patient.primaryPhysicianName ?: 'Unassigned'}"></dd></div><div><dt>Address</dt><dd th:text="${patient.address ?: 'Not provided'}"></dd></div></dl></section>
  <section class="panel"><div class="panel-heading"><div><h2>Appointment history</h2><p class="muted">The 50 most recent appointment dates, including cancellations.</p></div></div><div th:replace="~{fragments :: appointmentTable(${history})}"></div></section>
</main></div></body></html>
