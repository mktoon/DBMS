<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Request could not be completed')}"></head>
<body class="error-page"><main class="panel error-card"><span class="brand-mark">+</span><p class="eyebrow">LET'S GET YOU BACK ON TRACK</p><h1>Request could not be completed.</h1><p th:text="${friendlyMessage ?: (status == 404 ? 'That record or page was not found.' : 'The request could not be processed. Check your input or sign in again.')}" role="alert"></p><div class="actions"><a class="button" th:href="@{/}">Return to overview</a><a class="button secondary" th:href="@{/login}">Sign in</a></div></main></body></html>
